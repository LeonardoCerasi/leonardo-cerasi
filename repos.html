<!doctype html>

<html lang="en" data-bs-theme="dark" class="h-100">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

		<link href="./css/style.css" rel="stylesheet">

		<title>repos</title>
	</head>

	<body class="d-flex flex-column h-100" id="body">
    		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

		<!-- navbar -->

		<nav class="navbar navbar-expand-sm bg-body-secondary" id="navbar"></nav>
		<script>
			fetch("navbar.html")
				.then(r => r.text())
				.then(html => {
					document.getElementById("navbar").innerHTML = html;
					const currentPath = window.location.pathname.split("/").pop() || "index.html";
					document.querySelectorAll("#navbar .nav-link:not(.dropdown-toggle)").forEach(link => {
						const href = link.getAttribute("href");
						if (href && (href === `./${currentPath}` || href === currentPath)) {
							link.classList.add("active");
							link.setAttribute("id", "current-page");
							link.setAttribute("aria-current", "page");
						} else {
							link.classList.remove("active");
							link.removeAttribute("id");
							link.removeAttribute("aria-current");
						}
					});
				})
			.catch(err => console.error("Navbar load failed:", err));
		</script>

		<!-- main body -->

		<main class="" id="main">

			<div class="container text-center">

				<div class="row">
					<div class="col" style="padding: 3%;">
						<h1 class="heading1">💻 My repositories 💻</h1>
					</div>
				</div>

				<div class="row">
					<p>prova</p>
				</div>

			</div>

		</main>

		<!-- footer -->

		<footer class="footer mt-auto py-2 bg-body-secondary" id="footer"></footer>
		<script>
			fetch("footer.html")
				.then(response => response.text())
				.then(data => {
					document.getElementById("footer").innerHTML = data;
				});
		</script>
	</body>

</html>
